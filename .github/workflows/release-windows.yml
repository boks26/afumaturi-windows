name: Release Windows production

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: afumaturi-windows-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, sign and publish Windows
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_API_PATH: ${{ secrets.VITE_API_PATH }}
      VITE_API_TIMEOUT_MS: ${{ secrets.VITE_API_TIMEOUT_MS }}
      VITE_OAUTH_CLIENT_ID: ${{ secrets.VITE_OAUTH_CLIENT_ID }}
      VITE_OAUTH_CLIENT_SECRET: ${{ secrets.VITE_OAUTH_CLIENT_SECRET }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Validate release version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $tauriVersion) {
            throw "package.json ($packageVersion) and tauri.conf.json ($tauriVersion) differ."
          }
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$packageVersion") {
            throw "Tag ${{ github.ref_name }} does not match application version v$packageVersion."
          }
          foreach ($name in @("VITE_API_BASE_URL", "VITE_API_PATH", "VITE_API_TIMEOUT_MS", "VITE_OAUTH_CLIENT_ID", "VITE_OAUTH_CLIENT_SECRET")) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "$name is not configured."
            }
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Configure deployment key
        shell: pwsh
        env:
          DEPLOY_SSH_KEY_BASE64: ${{ secrets.DEPLOY_SSH_KEY_BASE64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if (-not $env:DEPLOY_SSH_KEY_BASE64) { throw "DEPLOY_SSH_KEY_BASE64 is not configured." }
          if (-not $env:DEPLOY_HOST) { throw "DEPLOY_HOST is not configured." }
          if (-not $env:DEPLOY_KNOWN_HOSTS) { throw "DEPLOY_KNOWN_HOSTS is not configured." }
          $keyPath = Join-Path $env:RUNNER_TEMP "afumaturi_contabo"
          try {
            $keyBytes = [Convert]::FromBase64String($env:DEPLOY_SSH_KEY_BASE64.Trim())
          } catch {
            throw "DEPLOY_SSH_KEY_BASE64 is not valid base64."
          }
          [IO.File]::WriteAllBytes($keyPath, $keyBytes)
          & icacls.exe $keyPath /inheritance:r | Out-Null
          & icacls.exe $keyPath /grant:r "${env:USERNAME}:(R)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not restrict deployment key permissions." }
          & ssh-keygen.exe -y -f $keyPath | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "DEPLOY_SSH_KEY_BASE64 does not decode to a valid OpenSSH private key."
          }
          $sshDirectory = Join-Path $HOME ".ssh"
          New-Item -ItemType Directory -Path $sshDirectory -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $sshDirectory "known_hosts"), $env:DEPLOY_KNOWN_HOSTS, [Text.UTF8Encoding]::new($false))
          "AFUMATURI_DEPLOY_KEY=$keyPath" >> $env:GITHUB_ENV

      - name: Build, sign and publish
        shell: pwsh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "TAURI_SIGNING_PRIVATE_KEY is not configured." }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured." }
          if (-not $env:DEPLOY_USER) { throw "DEPLOY_USER is not configured." }
          ./scripts/release-windows.ps1 `
            -Server $env:DEPLOY_HOST `
            -SshUser $env:DEPLOY_USER `
            -SshKeyPath $env:AFUMATURI_DEPLOY_KEY `
            -NonInteractive
